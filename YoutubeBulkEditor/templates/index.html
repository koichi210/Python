<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>YouTube 動画一括編集</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>🎬 YouTube 動画一括編集</h1>
    <span class="bulkLabel">取得対象:</span>
    <select id="sourceSelect">
      <option value="all" selected>全動画</option>
    </select>
    <button id="refreshPlaylistsBtn" title="プレイリスト一覧を更新">プレイリスト一覧を更新</button>
    <button id="loadBtn">動画一覧を取得</button>
    <button id="clearCacheBtn">キャッシュをクリア</button>
    <span id="status"></span>
  </header>

  <section class="toolbar" hidden id="toolbar">
    <div class="toolbarRow">
      <input type="text" id="filterBox" placeholder="タイトルで絞り込み...">

      <span class="bulkLabel">公開設定:</span>
      <select id="filterPrivacy">
        <option value="" selected>（フィルタしない）</option>
        <option value="public">公開</option>
        <option value="unlisted">限定公開</option>
        <option value="private">非公開</option>
      </select>

      <span class="bulkLabel">並び替え:</span>
      <select id="sortSelect">
        <option value="publishedAt_desc" selected>公開日時（新しい順）</option>
        <option value="publishedAt_asc">公開日時（古い順）</option>
        <option value="title_asc">タイトル（昇順）</option>
        <option value="title_desc">タイトル（降順）</option>
        <option value="uploadStatus_asc">アップロード状態</option>
        <option value="likeCount_desc">いいね数（多い順）</option>
        <option value="likeCount_asc">いいね数（少ない順）</option>
      </select>
    </div>

    <div class="toolbarRow">
      <button id="saveAllBtn">編集した行をまとめて保存</button>
      <span id="selectedCount">0件選択中</span>
      <span class="bulkLabel">適用先:</span>
      <select id="bulkPrivacy">
        <option value="" selected>（公開設定は変更しない）</option>
        <option value="public">公開</option>
        <option value="unlisted">限定公開</option>
        <option value="private">非公開</option>
      </select>
      <button id="bulkApplyBtn">選択した動画の公開設定をまとめて変更（タイトルは対象外）</button>
    </div>
  </section>

  <table id="videoTable" hidden>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll"></th>
        <th></th>
        <th>タイトル</th>
        <th>公開設定</th>
        <th>アップロード状態</th>
        <th>いいね数</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="videoTableBody"></tbody>
  </table>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
